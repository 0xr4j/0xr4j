<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="How I build: start with people, make it legible, test in the real world, widen the safety margin, repeat">
  <defs>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .s{font-family:'Segoe UI','Inter',Helvetica,Arial,sans-serif}
      .n{animation:n 8s linear infinite}
      @keyframes n{0%,6%{stroke-opacity:1;stroke-width:3}14%,100%{stroke-opacity:.45;stroke-width:1.5}}
    </style>
    <filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="200" rx="18" fill="#0b1020"/>
  <!-- track -->
  <path id="track" d="M150 78H1050A40 40 0 0 1 1090 118V128A40 40 0 0 1 1050 168H150A40 40 0 0 1 110 128V118A40 40 0 0 1 150 78Z" fill="none" stroke="#7cc4ff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="600" y="186" text-anchor="middle" class="m" font-size="12" fill="#8b9bc0" letter-spacing="4" style="paint-order:stroke" stroke="#0b1020" stroke-width="8">◀ REPEAT ◀</text>

  <circle r="5" fill="#ffffff" filter="url(#g)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150 78H1050A40 40 0 0 1 1090 118V128A40 40 0 0 1 1050 168H150A40 40 0 0 1 110 128V118A40 40 0 0 1 150 78Z"/>
  </circle>
  <!-- nodes -->
  <g class="s" font-size="17" font-weight="600" text-anchor="middle">
    <rect class="n" x="60" y="52" width="230" height="52" rx="26" fill="#0d1630" stroke="#74f0c0" style="animation-delay:0s"/>
    <text x="175" y="84" fill="#74f0c0">start with people</text>
    <rect class="n" x="340" y="52" width="210" height="52" rx="26" fill="#0d1630" stroke="#7cc4ff" style="animation-delay:1.2s"/>
    <text x="445" y="84" fill="#7cc4ff">make it legible</text>
    <rect class="n" x="600" y="52" width="250" height="52" rx="26" fill="#0d1630" stroke="#b38cff" style="animation-delay:2.3s"/>
    <text x="725" y="84" fill="#b38cff">test in the real world</text>
    <rect class="n" x="900" y="52" width="250" height="52" rx="26" fill="#0d1630" stroke="#ff6b8b" style="animation-delay:3.5s"/>
    <text x="1025" y="84" fill="#ff6b8b">widen the safety margin</text>
  </g>
  <g class="m" font-size="11" fill="#8b9bc0" text-anchor="middle" letter-spacing="2">
    <text x="175" y="38">01</text><text x="445" y="38">02</text><text x="725" y="38">03</text><text x="1025" y="38">04</text>
  </g>
  <g fill="#8b9bc0" class="m" font-size="18" text-anchor="middle">
    <text x="315" y="84">→</text><text x="575" y="84">→</text><text x="875" y="84">→</text>
  </g>

  <rect width="1199" height="199" x="0.5" y="0.5" rx="18" fill="none" stroke="#7cc4ff" stroke-opacity="0.15"/>
</svg>
