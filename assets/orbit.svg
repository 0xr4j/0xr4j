<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Toolbox in orbit: PyTorch, TransformerLens, nnsight, Inspect AI, Python, TypeScript, Leaflet, einops, Weights and Biases, BLE, LoRaWAN, ESP32-S3, C99">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.47" r="0.7">
      <stop offset="0" stop-color="#121a3a"/><stop offset="0.6" stop-color="#0a0f24"/><stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#74f0c0" stop-opacity="0.55"/><stop offset="1" stop-color="#74f0c0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:14px}
      .c{animation:c 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes c{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    </style>
  </defs>
  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <g fill="#cfe8ff">
    <circle class="tw" cx="80" cy="60" r="1.2"/><circle class="tw" cx="1120" cy="70" r="1.2" style="animation-delay:1s"/>
    <circle class="tw" cx="150" cy="380" r="1" style="animation-delay:2s"/><circle class="tw" cx="1060" cy="390" r="1" style="animation-delay:.5s"/>
    <circle class="tw" cx="420" cy="40" r="1" style="animation-delay:1.5s"/><circle class="tw" cx="800" cy="420" r="1" style="animation-delay:2.5s"/>
  </g>

  <!-- orbits -->
  <g fill="none" stroke-dasharray="3 7">
    <ellipse cx="600" cy="210" rx="180" ry="62" stroke="#74f0c0" stroke-opacity="0.4"/>
    <ellipse cx="600" cy="210" rx="340" ry="116" stroke="#7cc4ff" stroke-opacity="0.32"/>
    <ellipse cx="600" cy="210" rx="505" ry="170" stroke="#b38cff" stroke-opacity="0.28"/>
  </g>

  <!-- core -->
  <circle class="c" cx="600" cy="210" r="70" fill="url(#core)"/>
  <circle cx="600" cy="210" r="34" fill="#0b1020" stroke="#74f0c0" stroke-width="2"/>
  <text x="600" y="215" text-anchor="middle" class="m" fill="#74f0c0" style="font-size:13px">0xr4j</text>

  <!-- ring 1: interpretability & evals -->
  <g class="m">
    <g><animateMotion dur="26s" begin="0s" repeatCount="indefinite" path="M420 210a180 62 0 1 0 360 0a180 62 0 1 0 -360 0"/>
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0b1020" stroke="#74f0c0"/><text y="5" text-anchor="middle" fill="#74f0c0">PyTorch</text></g>
    <g><animateMotion dur="26s" begin="-6.5s" repeatCount="indefinite" path="M420 210a180 62 0 1 0 360 0a180 62 0 1 0 -360 0"/>
      <rect x="-72" y="-14" width="144" height="28" rx="14" fill="#0b1020" stroke="#74f0c0"/><text y="5" text-anchor="middle" fill="#74f0c0">TransformerLens</text></g>
    <g><animateMotion dur="26s" begin="-13s" repeatCount="indefinite" path="M420 210a180 62 0 1 0 360 0a180 62 0 1 0 -360 0"/>
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0b1020" stroke="#74f0c0"/><text y="5" text-anchor="middle" fill="#74f0c0">nnsight</text></g>
    <g><animateMotion dur="26s" begin="-19.5s" repeatCount="indefinite" path="M420 210a180 62 0 1 0 360 0a180 62 0 1 0 -360 0"/>
      <rect x="-52" y="-14" width="104" height="28" rx="14" fill="#0b1020" stroke="#74f0c0"/><text y="5" text-anchor="middle" fill="#74f0c0">Inspect AI</text></g>
  </g>

  <!-- ring 2: languages & tools -->
  <g class="m">
    <g><animateMotion dur="44s" begin="0s" repeatCount="indefinite" path="M940 210a340 116 0 1 1 -680 0a340 116 0 1 1 680 0"/>
      <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#0b1020" stroke="#7cc4ff"/><text y="5" text-anchor="middle" fill="#7cc4ff">Python</text></g>
    <g><animateMotion dur="44s" begin="-8.8s" repeatCount="indefinite" path="M940 210a340 116 0 1 1 -680 0a340 116 0 1 1 680 0"/>
      <rect x="-54" y="-14" width="108" height="28" rx="14" fill="#0b1020" stroke="#7cc4ff"/><text y="5" text-anchor="middle" fill="#7cc4ff">TypeScript</text></g>
    <g><animateMotion dur="44s" begin="-17.6s" repeatCount="indefinite" path="M940 210a340 116 0 1 1 -680 0a340 116 0 1 1 680 0"/>
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0b1020" stroke="#7cc4ff"/><text y="5" text-anchor="middle" fill="#7cc4ff">Leaflet</text></g>
    <g><animateMotion dur="44s" begin="-26.4s" repeatCount="indefinite" path="M940 210a340 116 0 1 1 -680 0a340 116 0 1 1 680 0"/>
      <rect x="-36" y="-14" width="72" height="28" rx="14" fill="#0b1020" stroke="#7cc4ff"/><text y="5" text-anchor="middle" fill="#7cc4ff">einops</text></g>
    <g><animateMotion dur="44s" begin="-35.2s" repeatCount="indefinite" path="M940 210a340 116 0 1 1 -680 0a340 116 0 1 1 680 0"/>
      <rect x="-26" y="-14" width="52" height="28" rx="14" fill="#0b1020" stroke="#7cc4ff"/><text y="5" text-anchor="middle" fill="#7cc4ff">W&amp;B</text></g>
  </g>

  <!-- ring 3: edge & hardware -->
  <g class="m">
    <g><animateMotion dur="64s" begin="-4s" repeatCount="indefinite" path="M95 210a505 170 0 1 0 1010 0a505 170 0 1 0 -1010 0"/>
      <rect x="-24" y="-14" width="48" height="28" rx="14" fill="#0b1020" stroke="#b38cff"/><text y="5" text-anchor="middle" fill="#b38cff">BLE</text></g>
    <g><animateMotion dur="64s" begin="-20s" repeatCount="indefinite" path="M95 210a505 170 0 1 0 1010 0a505 170 0 1 0 -1010 0"/>
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0b1020" stroke="#b38cff"/><text y="5" text-anchor="middle" fill="#b38cff">LoRaWAN</text></g>
    <g><animateMotion dur="64s" begin="-36s" repeatCount="indefinite" path="M95 210a505 170 0 1 0 1010 0a505 170 0 1 0 -1010 0"/>
      <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#0b1020" stroke="#b38cff"/><text y="5" text-anchor="middle" fill="#b38cff">ESP32-S3</text></g>
    <g><animateMotion dur="64s" begin="-52s" repeatCount="indefinite" path="M95 210a505 170 0 1 0 1010 0a505 170 0 1 0 -1010 0"/>
      <rect x="-24" y="-14" width="48" height="28" rx="14" fill="#0b1020" stroke="#b38cff"/><text y="5" text-anchor="middle" fill="#b38cff">C99</text></g>
  </g>

  <!-- legend -->
  <g class="m" style="font-size:12px" fill="#8b9bc0">
    <circle cx="318" cy="430" r="5" fill="#74f0c0"/><text x="330" y="434">interpretability &amp; evals</text>
    <circle cx="560" cy="430" r="5" fill="#7cc4ff"/><text x="572" y="434">languages &amp; tools</text>
    <circle cx="750" cy="430" r="5" fill="#b38cff"/><text x="762" y="434">edge &amp; hardware</text>
  </g>
  <rect width="1199" height="459" x="0.5" y="0.5" rx="18" fill="none" stroke="#7cc4ff" stroke-opacity="0.15"/>
</svg>
