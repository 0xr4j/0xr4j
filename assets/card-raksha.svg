<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-label="rakshasutra">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1328"/><stop offset="1" stop-color="#080b18"/></linearGradient>
    <radialGradient id="gl" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#74f0c0" stop-opacity="0.2"/><stop offset="1" stop-color="#74f0c0" stop-opacity="0"/></radialGradient>
    <style>
      .run{stroke-dasharray:14 86;animation:run 5s linear infinite;animation-delay:-1.2s}
      @keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
      .dot{animation:dot 1.6s ease-in-out infinite}
      @keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
      .arr{animation:arr 1.6s ease-in-out infinite}
      @keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
    </style>
  </defs>
  <rect x="2" y="2" width="476" height="216" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="476" height="216" rx="14" fill="url(#gl)"/>
  <rect x="2" y="2" width="476" height="216" rx="14" fill="none" stroke="#74f0c0" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect class="run" x="2" y="2" width="476" height="216" rx="14" fill="none" stroke="#74f0c0" stroke-width="2.5" stroke-linecap="round" pathLength="100"/>
  <text x="26" y="42" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#74f0c0" letter-spacing="2">// 02</text>
  <circle class="dot" cx="346" cy="37.5" r="4" fill="#74f0c0"/>
  <text x="454" y="42" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#74f0c0" letter-spacing="1.5">DESIGN STAGE</text>
  <text x="26" y="86" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="29" font-weight="700" fill="#f2f5ff">rakshasutra</text>
  <text x="26" y="118" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a9b4d0">Finding separated children and elders on a mountain</text>
  <text x="26" y="140" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15.5" fill="#a9b4d0">pilgrimage route. No phones, no cellular coverage.</text>
  <path d="M26 162H454" stroke="#7cc4ff" stroke-opacity="0.12"/>
  <text x="26" y="192" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#8b9bc0" letter-spacing="1">SIGNED BLE · LoRaWAN · ESP32-S3</text>
  <text class="arr" x="454" y="192" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#74f0c0">open →</text>
</svg>
