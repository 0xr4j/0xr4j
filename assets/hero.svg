<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Raj Jha — 0xr4j">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74f0c0"/>
      <stop offset="0.5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#b38cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#74f0c0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#74f0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#9c8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74f0c0" stop-opacity="0"/>
      <stop offset="1" stop-color="#74f0c0" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7cc4ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="radarClip"><circle cx="930" cy="210" r="160"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI','Inter',Helvetica,Arial,sans-serif}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .g1{animation:g1 6s steps(1) infinite}
      .g2{animation:g2 6s steps(1) infinite}
      @keyframes g1{0%,92%,100%{transform:translate(0,0);opacity:0}93%{transform:translate(-6px,2px);opacity:.8}95%{transform:translate(4px,-2px);opacity:.8}97%{opacity:0}}
      @keyframes g2{0%,92%,100%{transform:translate(0,0);opacity:0}93%{transform:translate(6px,-1px);opacity:.8}96%{transform:translate(-3px,2px);opacity:.8}98%{opacity:0}}
      .blip{animation:blip 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes blip{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1.4)}40%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
      .ring{animation:ring 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(2.6)}}
      .role{opacity:0;animation:role 16s infinite}
      @keyframes role{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
      .cur{animation:cur 1s steps(1) infinite}
      @keyframes cur{50%{opacity:0}}
      .scan{animation:scan 7s linear infinite}
      @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(440px)}}
      .fadein{opacity:0;animation:fade 1.2s ease-out forwards}
      @keyframes fade{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow2)"/>

  <!-- stars -->
  <g fill="#cfe8ff">
    <circle class="tw" cx="60" cy="40" r="1.2"/>
    <circle class="tw" cx="210" cy="90" r="1" style="animation-delay:.6s"/>
    <circle class="tw" cx="340" cy="30" r="1.4" style="animation-delay:1.2s"/>
    <circle class="tw" cx="480" cy="70" r="1" style="animation-delay:1.8s"/>
    <circle class="tw" cx="590" cy="22" r="1.2" style="animation-delay:.3s"/>
    <circle class="tw" cx="700" cy="380" r="1" style="animation-delay:2.1s"/>
    <circle class="tw" cx="120" cy="370" r="1.3" style="animation-delay:1.5s"/>
    <circle class="tw" cx="420" cy="395" r="1" style="animation-delay:.9s"/>
    <circle class="tw" cx="660" cy="120" r="1.1" style="animation-delay:2.4s"/>
    <circle class="tw" cx="1150" cy="40" r="1.2" style="animation-delay:.4s"/>
    <circle class="tw" cx="1160" cy="380" r="1" style="animation-delay:1.1s"/>
    <circle class="tw" cx="740" cy="60" r="1" style="animation-delay:2.7s"/>
  </g>

  <!-- radar -->
  <g>
    <circle cx="930" cy="210" r="160" fill="#06121a" fill-opacity="0.6" stroke="#74f0c0" stroke-opacity="0.35"/>
    <g fill="none" stroke="#74f0c0" stroke-opacity="0.18">
      <circle cx="930" cy="210" r="120"/>
      <circle cx="930" cy="210" r="80"/>
      <circle cx="930" cy="210" r="40"/>
      <path d="M770 210H1090M930 50V370"/>
      <path d="M817 97L1043 323M1043 97L817 323" stroke-opacity="0.08"/>
    </g>
    <g clip-path="url(#radarClip)">
      <g>
        <path d="M930 210L1090 210A160 160 0 0 0 1043 97Z" fill="url(#sweep)"/>
        <line x1="930" y1="210" x2="1090" y2="210" stroke="#74f0c0" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="-360 930 210" dur="4s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- blips -->
    <g fill="#74f0c0">
      <circle class="blip" cx="1010" cy="150" r="4" style="animation-delay:.35s"/>
      <circle class="blip" cx="880" cy="120" r="3.5" style="animation-delay:1.1s"/>
      <circle class="blip" cx="850" cy="270" r="4" style="animation-delay:2.2s"/>
      <circle class="blip" cx="1000" cy="300" r="3" style="animation-delay:3.3s"/>
    </g>
    <circle class="ring" cx="1010" cy="150" r="8" fill="none" stroke="#ff6b8b" stroke-width="1.5" style="animation-delay:.35s"/>
    <circle cx="930" cy="210" r="4" fill="#74f0c0"/>
    <text x="930" y="395" text-anchor="middle" class="mono" font-size="12" fill="#74f0c0" fill-opacity="0.6" letter-spacing="3">EDGE · SENSE · DECIDE · SAFELY</text>
  </g>

  <!-- left text block -->
  <g class="fadein">
    <text x="70" y="92" class="mono" font-size="16" fill="#74f0c0" letter-spacing="2">&gt; hello, world_ i'm</text>

    <g class="sans" font-size="92" font-weight="800" letter-spacing="-2">
      <text class="g1" x="70" y="190" fill="#ff3d81" fill-opacity="0.7">RAJ JHA</text>
      <text class="g2" x="70" y="190" fill="#3de1ff" fill-opacity="0.7">RAJ JHA</text>
      <text x="70" y="190" fill="url(#name)">RAJ JHA</text>
    </g>

    <g>
      <rect x="72" y="208" width="88" height="28" rx="6" fill="#74f0c0" fill-opacity="0.12" stroke="#74f0c0" stroke-opacity="0.5"/>
      <text x="116" y="227" text-anchor="middle" class="mono" font-size="14" fill="#74f0c0">0xr4j</text>
      <text x="176" y="227" class="mono" font-size="14" fill="#8b9bc0">COO @mth · MnC undergrad · independent researcher</text>
    </g>

    <!-- rotating roles -->
    <g class="mono" font-size="22" fill="#e6edff">
      <text x="70" y="290" fill="#8b9bc0">$ focus --now</text>
      <text class="role" x="70" y="325" style="animation-delay:0s"><tspan fill="#b38cff">→</tspan> technical AI safety <tspan fill="#8b9bc0">(ARENA)</tspan></text>
      <text class="role" x="70" y="325" style="animation-delay:4s"><tspan fill="#b38cff">→</tspan> counter-drone systems</text>
      <text class="role" x="70" y="325" style="animation-delay:8s"><tspan fill="#b38cff">→</tspan> assistive wearables</text>
      <text class="role" x="70" y="325" style="animation-delay:12s"><tspan fill="#b38cff">→</tspan> edge intelligence</text>
    </g>
    <rect class="cur" x="70" y="345" width="12" height="3" fill="#74f0c0"/>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#74f0c0" fill-opacity="0.08"/>
  <rect width="1199" height="419" x="0.5" y="0.5" rx="18" fill="none" stroke="#7cc4ff" stroke-opacity="0.15"/>
</svg>
